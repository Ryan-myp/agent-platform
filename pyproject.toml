[project]
name = "agent-platform"
version = "0.1.0"
description = "Extensible, human-approved workflow platform for marketing video creation"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.52.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
